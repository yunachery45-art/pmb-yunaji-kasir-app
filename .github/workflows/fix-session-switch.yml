name: Fix PJ/Admin session switch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: startsWith(github.event.issue.title, '[botfix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch session switching
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "$('logoutBtn').onclick=()=>db.auth.signOut({scope:'local'});document.querySelectorAll('.menu-card').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));"
          new = "$('logoutBtn').onclick=async()=>{await db.auth.signOut({scope:'local'});location.href='index.html'};document.querySelectorAll('.menu-card').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));const sideNav=document.querySelector('.side-nav');if(sideNav&&!document.getElementById('adminSideLink')){const a=document.createElement('a');a.id='adminSideLink';a.className='menu-card';a.href='admin.html';a.innerHTML='<span class=\"nav-icon\">🔐</span><span>Admin</span>';sideNav.appendChild(a)};const sideLogout=document.querySelector('.logout-side');if(sideLogout)sideLogout.textContent='↪ Ganti PJ / Keluar';"
          if old not in s:
              raise SystemExit('Expected logout code not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/workflows/fix-session-switch.yml
          git commit -m "Fix PJ session logout and Admin navigation"
          git push

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Session switch fix applied."
